<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jarvis</title>
<link rel="icon" href="/favicon.ico">
<style>
  :root {
    --bg: #05080f;
    --bg-2: #0a1220;
    --panel: rgba(14, 26, 44, 0.72);
    --line: rgba(90, 200, 255, 0.18);
    --text: #dceaf7;
    --muted: #7d93ab;
    --accent: #4fd6ff;
    --accent-2: #2a8cff;
    --user: #1b3a5c;
    --danger: #ff6b7a;
    --radius: 14px;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: radial-gradient(1200px 700px at 50% -10%, #0f2340 0%, var(--bg-2) 45%, var(--bg) 100%);
    color: var(--text);
    font-family: "Segoe UI", "Yu Gothic UI", "Meiryo", system-ui, sans-serif;
    display: flex; flex-direction: column;
    overflow: hidden;
  }

  header {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 18px;
    border-bottom: 1px solid var(--line);
    background: rgba(5, 10, 18, 0.6);
    backdrop-filter: blur(6px);
  }
  header { flex-wrap: wrap; row-gap: 8px; }
  @media (max-width: 760px) { .spacer { flex-basis: 100%; height: 0; } }
  .brand { font-weight: 600; letter-spacing: 0.32em; color: var(--accent); font-size: 15px; }
  .model { color: var(--muted); font-size: 12px; font-family: Consolas, monospace; }
  .spacer { flex: 1; }
  .toggle, .btn-ghost, select {
    background: transparent; color: var(--text);
    border: 1px solid var(--line); border-radius: 999px;
    padding: 6px 12px; font: inherit; font-size: 12.5px; cursor: pointer;
  }
  select { max-width: 220px; border-radius: 8px; background: var(--bg-2); }
  .toggle:disabled { opacity: .4; cursor: not-allowed; }
  .toggle[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); background: rgba(79, 214, 255, 0.08); }
  .btn-ghost:hover, .toggle:hover { border-color: var(--accent); }
  .volume { display: flex; align-items: center; gap: 6px; border: 1px solid var(--line); border-radius: 999px; padding: 3px 12px 3px 10px; font-size: 12.5px; }
  .volume:hover { border-color: var(--accent); }
  .volume input { width: 90px; accent-color: var(--accent); cursor: pointer; margin: 0; }
  .volume output { min-width: 3.2em; text-align: right; color: var(--muted); font-family: Consolas, monospace; font-size: 12px; }

  main { flex: 1; position: relative; display: flex; min-height: 0; overflow: hidden; }

  /* 中央のリアクター。画面の高さに合わせて大きく表示する */
  .stage { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 8px 16px; min-width: 0; }
  #orb {
    width: min(88vw, calc(100vh - 240px), 760px); min-width: 200px; aspect-ratio: 1; height: auto;
    transition: opacity .5s, transform .5s cubic-bezier(.2, .8, .2, 1);
  }
  body.has-panel #orb { opacity: .75; }
  #status { margin-top: -10px; color: var(--muted); font-size: 14px; letter-spacing: 0.16em; min-height: 20px; }

  /* リアクターから出てくる表示パネル（位置は layoutPanels() が決める） */
  #holo { position: absolute; inset: 0; z-index: 2; pointer-events: none; padding: 16px; overflow: hidden; }
  .panel {
    pointer-events: auto; position: absolute; left: 0; top: 0;
    width: min(400px, calc(100% - 32px)); max-height: 60%; overflow-y: auto;
    background: linear-gradient(180deg, rgba(10, 30, 52, 0.88), rgba(5, 14, 26, 0.9));
    border: 1px solid rgba(79, 214, 255, 0.45); border-radius: 6px;
    box-shadow: 0 0 0 1px rgba(79, 214, 255, 0.08) inset, 0 0 32px rgba(79, 214, 255, 0.22);
    backdrop-filter: blur(8px);
    scrollbar-width: thin; scrollbar-color: var(--line) transparent;
  }
  .panel::before {  /* 四隅の枠 */
    content: ""; position: absolute; inset: 4px; pointer-events: none;
    --c: var(--accent);
    background:
      linear-gradient(var(--c), var(--c)) top left / 14px 2px, linear-gradient(var(--c), var(--c)) top left / 2px 14px,
      linear-gradient(var(--c), var(--c)) top right / 14px 2px, linear-gradient(var(--c), var(--c)) top right / 2px 14px,
      linear-gradient(var(--c), var(--c)) bottom left / 14px 2px, linear-gradient(var(--c), var(--c)) bottom left / 2px 14px,
      linear-gradient(var(--c), var(--c)) bottom right / 14px 2px, linear-gradient(var(--c), var(--c)) bottom right / 2px 14px;
    background-repeat: no-repeat; opacity: .8;
  }
  .panel > * { animation: panel-reveal .45s .4s both; }
  .panel .scan {  /* 出現時に一度だけ走る走査線 */
    position: absolute; left: 0; right: 0; top: 0; height: 40%; pointer-events: none;
    background: linear-gradient(180deg, transparent, rgba(79, 214, 255, 0.18), transparent);
    animation: panel-scan 1s .35s ease-out both;
  }
  @keyframes panel-reveal { from { opacity: 0; } to { opacity: 1; } }
  @keyframes panel-scan { from { transform: translateY(-100%); opacity: 1; } to { transform: translateY(260%); opacity: 0; } }
  .panel header {
    display: flex; align-items: center; gap: 10px; padding: 12px 14px 10px 18px;
    border-bottom: 1px solid var(--line); background: none; backdrop-filter: none;
  }
  .panel h3 { flex: 1; margin: 0; font-size: 14px; font-weight: 600; letter-spacing: .12em; color: var(--accent); }
  .panel .close { background: none; border: 1px solid var(--line); color: var(--muted); border-radius: 50%; width: 26px; height: 26px; cursor: pointer; font-size: 13px; line-height: 1; }
  .panel .close:hover { color: var(--text); border-color: var(--accent); }
  .panel .body { padding: 12px 18px 16px; line-height: 1.75; white-space: pre-wrap; word-break: break-word; font-size: 14.5px; }
  .panel .body a { color: var(--accent); }
  .panel img { display: block; max-width: 100%; max-height: 52vh; margin: 12px auto 0; border-radius: 4px; }
  .panel img + .body { padding-top: 8px; }
  .panel.error { border-color: rgba(255, 107, 122, 0.5); box-shadow: 0 0 28px rgba(255, 107, 122, 0.2); }
  .panel.error::before { --c: var(--danger); }
  .panel.error h3 { color: var(--danger); }
  .panel.placed { transition: left .5s cubic-bezier(.2, .8, .2, 1), top .5s cubic-bezier(.2, .8, .2, 1), filter .3s; }
  /* 収まりきらず重ねたパネル。クリックすると手前に出す */
  .panel.stacked { filter: brightness(.6); cursor: pointer; }
  .panel.stacked:hover { filter: brightness(.85); }

  /* 会話ログ（既定では隠し、ボタンで右から引き出す） */
  #log {
    position: absolute; top: 0; right: 0; bottom: 0; z-index: 3; width: min(440px, 100%);
    overflow-y: auto; padding: 14px 16px 24px;
    display: flex; flex-direction: column; gap: 10px;
    background: rgba(5, 10, 18, 0.92); border-left: 1px solid var(--line); backdrop-filter: blur(8px);
    transform: translateX(100%); visibility: hidden; transition: transform .3s ease, visibility .3s;
    scrollbar-width: thin; scrollbar-color: var(--line) transparent;
  }
  body.show-log #log { transform: none; visibility: visible; }
  .stage, #holo { transition: padding-right .3s ease; }
  @media (min-width: 900px) { body.show-log .stage, body.show-log #holo { padding-right: 456px; } }  /* 広い画面ではログの横にリアクターをずらす */

  .mic-warning { margin-top: 8px; max-width: min(560px, 92vw); text-align: center; font-size: 12.5px; line-height: 1.6; color: #ffcf6b; border: 1px solid rgba(255, 207, 107, 0.35); background: rgba(255, 207, 107, 0.07); border-radius: 10px; padding: 6px 12px; }
  .msg { max-width: 82%; padding: 10px 14px; border-radius: var(--radius); line-height: 1.7; white-space: pre-wrap; word-break: break-word; font-size: 14.5px; }
  .msg.user { align-self: flex-end; background: var(--user); border-bottom-right-radius: 4px; }
  .msg.jarvis { align-self: flex-start; background: var(--panel); border: 1px solid var(--line); border-bottom-left-radius: 4px; }
  .msg.jarvis a { color: var(--accent); }
  .log-empty { color: var(--muted); text-align: center; font-size: 13px; margin-top: 24px; }
  .msg.error { align-self: center; color: var(--danger); background: rgba(255, 107, 122, 0.08); border: 1px solid rgba(255, 107, 122, 0.3); font-size: 13px; }
  .chip { display: inline-block; font-size: 12px; color: var(--accent); border: 1px solid var(--line); border-radius: 999px; padding: 1px 9px; margin: 2px 0 6px; }
  .notice { display: block; color: var(--muted); font-size: 12.5px; font-style: italic; }
  .hint { color: var(--muted); text-align: center; font-size: 13px; margin-top: 8px; line-height: 1.8; }

  footer { padding: 12px 18px 18px; border-top: 1px solid var(--line); background: rgba(5, 10, 18, 0.6); }
  .bar { width: min(860px, 100%); margin: 0 auto; display: flex; gap: 10px; align-items: flex-end; }
  #mic {
    width: 52px; height: 52px; border-radius: 50%; flex: none;
    border: 1px solid var(--accent); background: rgba(79, 214, 255, 0.08);
    color: var(--accent); cursor: pointer; display: grid; place-items: center;
    transition: background .2s, box-shadow .2s;
  }
  #mic:hover { background: rgba(79, 214, 255, 0.16); }
  #mic.on { background: var(--accent); color: var(--bg); box-shadow: 0 0 24px rgba(79, 214, 255, 0.6); }
  #mic:disabled { opacity: .35; cursor: not-allowed; }
  #input {
    flex: 1; min-width: 0; padding: 14px 16px; border-radius: 24px;
    border: 1px solid var(--line); background: var(--bg-2); color: var(--text);
    font: inherit; font-size: 14.5px; line-height: 1.5; outline: none;
    resize: none; max-height: calc(1.5em * 5 + 28px); overflow-y: auto;  /* 5行まで広がり、それ以上はスクロール */
  }
  #input:focus { border-color: var(--accent); }
  #send { padding: 0 20px; height: 48px; border-radius: 999px; border: none; background: var(--accent-2); color: white; font: inherit; cursor: pointer; }
  #send:disabled { opacity: .4; cursor: not-allowed; }

  dialog { background: var(--bg-2); color: var(--text); border: 1px solid var(--line); border-radius: var(--radius); width: min(520px, 92vw); padding: 18px 20px; }
  dialog::backdrop { background: rgba(0, 0, 0, 0.6); }
  dialog h2 { margin: 0 0 10px; font-size: 15px; color: var(--accent); letter-spacing: .1em; }
  dialog ol { padding-left: 1.4em; line-height: 1.8; max-height: 50vh; overflow: auto; }
  @media (prefers-reduced-motion: reduce) { .panel > * { animation: none; } .panel .scan { display: none; } }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
</style>
</head>
<body>
<header>
  <span class="brand">J.A.R.V.I.S.</span>
  <span class="model">__JARVIS_MODEL__</span>
  <span class="spacer"></span>
  <select id="voice" title="読み上げの声"></select>
  <label class="volume" title="Jarvis の音量（読み上げとチャイム）">
    <span aria-hidden="true">🔉</span>
    <input type="range" id="volume" min="0" max="100" step="5" aria-label="Jarvis の音量">
    <output id="volumeValue" for="volume"></output>
  </label>
  <button class="toggle" id="wakeToggle" aria-pressed="false" title="「Hey Jarvis」と呼びかけるとマイクが起動します">👂 Hey Jarvis</button>
  <button class="toggle" id="speakToggle" aria-pressed="true" title="返答を音声で読み上げる">🔊 読み上げ</button>
  <button class="toggle" id="convToggle" aria-pressed="false" title="読み上げ後に自動でマイクを再開する">🔁 会話モード</button>
  <button class="toggle" id="recordToggle" aria-pressed="true" title="会話を記録して自動で記憶する（オフの間の会話は残りません）">📝 記録</button>
  <button class="toggle" id="logToggle" aria-pressed="false" title="会話の内容を表示する">💬 ログ</button>
  <button class="btn-ghost" id="memoryBtn">メモ</button>
  <button class="btn-ghost" id="resetBtn">リセット</button>
</header>

<main>
  <div class="stage">
    <canvas id="orb" width="520" height="520" aria-hidden="true"></canvas>
    <div id="status" role="status">待機中</div>
    <div class="hint" id="hint">「Hey Jarvis」と呼びかけるか、マイクボタン（Ctrl+Space）を押して話しかけてください。<br>文字で入力して Enter でも送れます（Shift+Enter で改行）。</div>
    <div id="micWarning" class="mic-warning" hidden></div>
  </div>
  <div id="holo" aria-live="polite"></div>
  <div id="log" aria-label="会話ログ"><div class="log-empty">まだ会話はありません。</div></div>
</main>

<footer>
  <div class="bar">
    <button id="mic" title="音声入力 (Ctrl+Space)" aria-label="音声入力">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10v1a7 7 0 0 0 14 0v-1"/><path d="M12 18v4"/></svg>
    </button>
    <label for="input" class="sr-only">メッセージ</label>
    <textarea id="input" rows="1" placeholder="Jarvis に話しかける…（Shift+Enter で改行）" autocomplete="off"></textarea>
    <button id="send">送信</button>
  </div>
</footer>

<dialog id="memoryDialog">
  <h2>長期メモ</h2>
  <div id="memoryBody"></div>
  <p class="hint" style="text-align:left">消したいときは「◯番のメモを消して」と話しかけてください。</p>
  <form method="dialog" style="text-align:right"><button class="btn-ghost">閉じる</button></form>
</dialog>

<script>
const TOKEN = "__JARVIS_TOKEN__";
const AUTO_MEMORY = __JARVIS_AUTO_MEMORY__;  // .env の JARVIS_AUTO_MEMORY=off なら常に記録しない
const $ = (id) => document.getElementById(id);
const logEl = $("log"), inputEl = $("input"), micBtn = $("mic"), sendBtn = $("send"), statusEl = $("status");
const canvas = $("orb"), ctx = canvas.getContext("2d");
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;

// ---------- 設定（このPCのブラウザにだけ保存） ----------
const store = {
  get(k, d) { try { const v = localStorage.getItem("jarvis." + k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem("jarvis." + k, JSON.stringify(v)); } catch {} },
};
let speakEnabled = store.get("speak", true);
let convMode = store.get("conv", false);
let showLog = store.get("log", false);
let recordEnabled = true;  // 記録は起動するたびに ON から始める（OFF はその間だけ）
function syncToggles() {
  $("speakToggle").setAttribute("aria-pressed", speakEnabled);
  $("convToggle").setAttribute("aria-pressed", convMode);
  $("logToggle").setAttribute("aria-pressed", showLog);
  $("recordToggle").setAttribute("aria-pressed", AUTO_MEMORY && recordEnabled);
  document.body.classList.toggle("show-log", showLog);
}
syncToggles();
$("logToggle").onclick = () => { showLog = !showLog; store.set("log", showLog); syncToggles(); if (showLog) scrollDown(); };
$("speakToggle").onclick = () => { speakEnabled = !speakEnabled; store.set("speak", speakEnabled); if (!speakEnabled) stopSpeaking(); syncToggles(); };
$("recordToggle").disabled = !AUTO_MEMORY;
if (!AUTO_MEMORY) $("recordToggle").title = ".env で JARVIS_AUTO_MEMORY=off のため記録しません";
$("recordToggle").onclick = () => { recordEnabled = !recordEnabled; syncToggles(); };
$("convToggle").onclick = () => { convMode = !convMode; store.set("conv", convMode); syncToggles(); };

// 音量（0〜1）。VOICEVOX・ブラウザの声・チャイムのすべてに掛ける
let volume = Math.min(1, Math.max(0, Number(store.get("volume", 1)) || 0));
function syncVolume() {
  $("volume").value = Math.round(volume * 100);
  $("volumeValue").textContent = Math.round(volume * 100) + "%";
  $("volume").previousElementSibling.textContent = volume === 0 ? "🔇" : volume < 0.5 ? "🔉" : "🔊";
}
syncVolume();
$("volume").oninput = (e) => {
  volume = e.target.value / 100;
  store.set("volume", volume);
  if (vvAudio) vvAudio.volume = volume;  // 再生中の VOICEVOX にもすぐ反映する
  syncVolume();
};

// ---------- 状態表示 ----------
const STATUS_TEXT = { idle: "待機中", listening: "聞いています…", thinking: "考えています…", speaking: "お話ししています" };
let state = "idle";
function setState(s, text) { state = s; statusEl.textContent = text || STATUS_TEXT[s]; micBtn.classList.toggle("on", s === "listening"); }

// ---------- 読み上げ（VOICEVOX、またはブラウザ内蔵の音声合成） ----------
const synth = window.speechSynthesis;
const VOICEVOX = "voicevox";
let voices = [], chosenVoice = null, useVoicevox = true, pendingUtterances = 0;
function loadVoices() {
  voices = synth ? synth.getVoices().filter(v => v.lang && v.lang.toLowerCase().startsWith("ja")) : [];
  const saved = store.get("speaker", VOICEVOX);
  // ブラウザの声は VOICEVOX に繋がらないときの代わりにも使う
  chosenVoice = voices.find(v => v.name === saved)
    || voices.find(v => /Keita.*(Natural|Online)/i.test(v.name))
    || voices.find(v => /(Natural|Online)/i.test(v.name))
    || voices[0] || null;
  useVoicevox = !chosenVoice || chosenVoice.name !== saved;
  const sel = $("voice");
  sel.innerHTML = "";
  const options = [[VOICEVOX, "VOICEVOX:ナースロボ_タイプT"], ...voices.map(v => [v.name, v.name.replace(/^Microsoft\s*/, "").replace(/\s*-\s*Japanese.*$/, "")])];
  for (const [value, label] of options) {
    const o = document.createElement("option");
    o.value = value; o.textContent = label;
    o.selected = useVoicevox ? value === VOICEVOX : value === chosenVoice.name;
    sel.appendChild(o);
  }
}
loadVoices();
if (synth) synth.onvoiceschanged = loadVoices;
$("voice").onchange = (e) => {
  store.set("speaker", e.target.value);
  useVoicevox = e.target.value === VOICEVOX;
  if (!useVoicevox) chosenVoice = voices.find(v => v.name === e.target.value) || chosenVoice;
};

function cleanForSpeech(t) {
  return t.replace(/https?:\/\/\S+/g, "")
          .replace(/[*#`>_~|]/g, "")
          .replace(/^\s*[-・]\s*/gm, "")
          .replace(/\(\s*\)|（\s*）/g, "")
          .trim();
}
function speak(text) {
  const t = cleanForSpeech(text);
  if (!speakEnabled || !t) return;
  useVoicevox ? speakVoicevox(t) : speakBrowser(t);
}
function speakBrowser(t) {
  if (!synth) return;
  const u = new SpeechSynthesisUtterance(t);
  u.lang = "ja-JP"; u.rate = 1.05; u.volume = volume;
  if (chosenVoice) u.voice = chosenVoice;
  pendingUtterances++;
  u.onstart = () => setState("speaking");
  u.onend = u.onerror = () => { pendingUtterances = Math.max(0, pendingUtterances - 1); afterSpeech(); };
  synth.speak(u);
}

// 文ごとに音声合成をすぐ始め、再生は順番どおりに行う
let vvChain = Promise.resolve(), vvGen = 0, vvAudio = null, vvWarned = false;
function speakVoicevox(t) {
  const gen = vvGen;
  pendingUtterances++;
  const wav = fetch("/api/tts", {
    method: "POST",
    headers: { "Content-Type": "application/json", "X-Jarvis-Token": TOKEN },
    body: JSON.stringify({ text: t }),
  }).then(async (res) => { if (!res.ok) throw new Error((await res.json().catch(() => ({}))).error || "HTTP " + res.status); return res.blob(); });
  wav.catch(() => {});
  vvChain = vvChain.then(async () => {
    if (gen !== vvGen) return;
    let blob;
    try { blob = await wav; vvWarned = false; }
    catch (err) {
      if (gen !== vvGen) return;
      if (!vvWarned) { vvWarned = true; addError((err.message || String(err)) + "　VOICEVOX を起動してください。それまではブラウザの声で読み上げます。"); }
      speakBrowser(t);
      return;
    }
    if (gen === vvGen) await playWav(blob);
  }).finally(() => {
    if (gen !== vvGen) return;  // 途中で止めた分はstopSpeaking()で数え直し済み
    pendingUtterances = Math.max(0, pendingUtterances - 1); afterSpeech();
  });
}
function playWav(blob) {
  return new Promise((resolve) => {
    const url = URL.createObjectURL(blob);
    const audio = new Audio(url);
    audio.volume = volume;
    const done = () => { URL.revokeObjectURL(url); if (vvAudio === audio) vvAudio = null; resolve(); };
    audio.onended = audio.onerror = done;
    audio.stop = () => { audio.pause(); done(); };
    vvAudio = audio;
    audio.play().then(() => setState("speaking")).catch(done);
  });
}
function stopSpeaking() {
  if (synth) synth.cancel();
  vvGen++; vvChain = Promise.resolve();
  if (vvAudio) vvAudio.stop();
  pendingUtterances = 0; if (state === "speaking") setState("idle");
}
function afterSpeech() {
  if (pendingUtterances > 0 || busy) return;
  setState("idle");
  if (convMode && recognition) startListening();
}

// 文の区切りごとに読み上げを始め、返答の完了を待たずに話し始める
let speechBuffer = "";
function feedSpeech(delta, final = false) {
  speechBuffer += delta;
  const re = /^[\s\S]*?[。！？!?\n]/;
  let m;
  while ((m = speechBuffer.match(re))) { speak(m[0]); speechBuffer = speechBuffer.slice(m[0].length); }
  if (final && speechBuffer.trim()) { speak(speechBuffer); speechBuffer = ""; }
}

// ---------- 音声入力（ブラウザ内蔵の音声認識） ----------
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let recognition = null, finalText = "", listening = false;
if (SR) {
  recognition = new SR();
  recognition.lang = "ja-JP";
  recognition.interimResults = true;
  recognition.continuous = false;
  recognition.onresult = (e) => {
    let interim = "";
    for (let i = e.resultIndex; i < e.results.length; i++) {
      const r = e.results[i];
      if (r.isFinal) finalText += r[0].transcript; else interim += r[0].transcript;
    }

// オーブの演出用にマイクの音量を拾う（失敗しても音声認識には影響しない）
let audioCtx = null, analyser = null, micStream = null, levelData = null, freqData = null;
async function startMicLevel() {
  try {
    micStream = await navigator.mediaDevices.getUserMedia({ audio: true });
    audioCtx = audioCtx || new AudioContext();
    const src = audioCtx.createMediaStreamSource(micStream);
    analyser = audioCtx.createAnalyser(); analyser.fftSize = 256; analyser.smoothingTimeConstant = 0.7;
    levelData = new Uint8Array(analyser.frequencyBinCount);
    freqData = new Uint8Array(analyser.frequencyBinCount);  // 外周のスペクトル表示用

}
function stopMicLevel() { if (micStream) micStream.getTracks().forEach(t => t.stop()); micStream = null; analyser = null; }
function micLevel() {
  if (!analyser) return 0;
  analyser.getByteTimeDomainData(levelData);
  let sum = 0; for (const v of levelData) { const d = (v - 128) / 128; sum += d * d; }
  return Math.min(1, Math.sqrt(sum / levelData.length) * 4);
}

// ---------- 表示パネル（リアクターから出現し、閉じるとリアクターへ戻る） ----------
const holo = $("holo");
const PANEL_GAP = 14, PANEL_STEP = 12, PILE_OFFSET = 26, MAX_PANELS = 12;
const CORE_RATIO = 128 / 520;  // リアクターの中心部分（内側のコイルと波形の輪）の半径。描画座標 520 に対する比
let panelSeq = 0;
function renderBody(s) { return renderText(s).replace(/^[-・]\s+/gm, "• "); }
// パネルの中心からリアクターの中心へのずれ（出現・収納のアニメーションの起点）
function towardReactor(el, scale) {
  const o = canvas.getBoundingClientRect(), r = el.getBoundingClientRect();
  const dx = o.left + o.width / 2 - (r.left + r.width / 2), dy = o.top + o.height / 2 - (r.top + r.height / 2);
  return `translate(${dx}px, ${dy}px) scale(${scale})`;
}
// ---- 配置：新しいパネルほどリアクターの中心に近い空き場所へ置き、収まらない古いものは重ねて奥に置く ----
// 矩形がリアクター中心部の円にどれだけ食い込むか（0 なら重ならない）
function coreOverlap(x, y, w, h, core) {
  const nx = Math.max(x, Math.min(core.x, x + w)), ny = Math.max(y, Math.min(core.y, y + h));
  return Math.max(0, core.r + PANEL_GAP - Math.hypot(core.x - nx, core.y - ny));
}
// 2つの矩形の重なり面積（間隔 PANEL_GAP も重なりとみなす）
function overlapArea(a, b) {
  const w = Math.min(a.x + a.w, b.x + b.w) - Math.max(a.x, b.x) + PANEL_GAP;
  const h = Math.min(a.y + a.h, b.y + b.h) - Math.max(a.y, b.y) + PANEL_GAP;
  return w > 0 && h > 0 ? w * h : 0;
}
function steps(from, to) {
  if (to <= from) return [from];
  const list = [];
  for (let v = from; v < to; v += PANEL_STEP) list.push(v);
  list.push(to);
  return list;
}
// 領域内の候補位置のうち cost が最小のもの（すべて Infinity なら null）
function bestSpot(w, h, area, cost) {
  let best = null, bestCost = Infinity;
  for (const x of steps(area.l, area.r - w)) for (const y of steps(area.t, area.b - h)) {
    const c = cost(x, y);
    if (c < bestCost) { bestCost = c; best = { x, y }; }
  }
  return best;
}
function placePanel(el, x, y, z, stacked) {
  el.style.left = x + "px"; el.style.top = y + "px"; el.style.zIndex = z;
  el.classList.toggle("stacked", stacked);
  if (!el.classList.contains("placed")) { el.offsetWidth; el.classList.add("placed"); }  // 初回は移動アニメーションなしで置く
}
function layoutPanels() {
  const panels = [...holo.querySelectorAll(".panel:not(.closing)")].sort((a, b) => b.dataset.seq - a.dataset.seq);  // 新しい順
  document.body.classList.toggle("has-panel", panels.length > 0);
  if (!panels.length) return;
  const cs = getComputedStyle(holo), hr = holo.getBoundingClientRect(), or = canvas.getBoundingClientRect();
  const area = {
    l: parseFloat(cs.paddingLeft), t: parseFloat(cs.paddingTop),
    r: holo.clientWidth - parseFloat(cs.paddingRight), b: holo.clientHeight - parseFloat(cs.paddingBottom),
  };
  const core = { x: or.left + or.width / 2 - hr.left, y: or.top + or.height / 2 - hr.top, r: or.width * CORE_RATIO };
  const distance = (x, y, w, h) => Math.hypot(x + w / 2 - core.x, y + h / 2 - core.y);

  // 新しいものから順に、中心部にも他のパネルにも重ならない、中心に最も近い位置へ置く
  const placed = [], pile = [];
  panels.forEach((el, i) => {
    const w = el.offsetWidth, h = el.offsetHeight;
    let spot = bestSpot(w, h, area, (x, y) => {
      if (coreOverlap(x, y, w, h, core) > 0) return Infinity;
      const r = { x, y, w, h };
      if (placed.some(p => overlapArea(r, p) > 0)) return Infinity;
      return distance(x, y, w, h);
    });
    // いちばん新しいパネルは必ず手前に出す（どこにも収まらない狭い画面では中心部を覆う量が最小の位置）
    if (!spot && i === 0) spot = bestSpot(w, h, area, (x, y) => coreOverlap(x, y, w, h, core) * 1e6 + distance(x, y, w, h));
    if (!spot) { pile.unshift(el); return; }  // 収まらないものは重ねて置く
    placed.push({ x: spot.x, y: spot.y, w, h });
    placePanel(el, spot.x, spot.y, 100 + panels.length - i, false);
  });

  // 収まらなかったパネルは、古いものほど奥になるようずらして重ね、空いている所に置く（pile は古い順）
  if (!pile.length) return;
  const sizes = pile.map(el => ({ w: el.offsetWidth, h: el.offsetHeight }));
  // 中心部をなるべく覆わない位置を、ずらし幅を詰めながら探す（重なりは他のパネル < 中心部 の順に避ける）
  let best = null;
  for (const off of pile.length > 1 ? [PILE_OFFSET, 16, 8] : [0]) {
    const pw = Math.max(...sizes.map((s, k) => k * off + s.w)), ph = Math.max(...sizes.map((s, k) => k * off + s.h));
    const cost = (x, y) => {
      const r = { x, y, w: pw, h: ph };
      const coreHit = sizes.reduce((s, c, k) => s + coreOverlap(x + k * off, y + k * off, c.w, c.h, core), 0);
      return coreHit * 1e6 + placed.reduce((s, p) => s + overlapArea(r, p), 0) * 10 + distance(x, y, pw, ph);
    };
    const spot = bestSpot(pw, ph, area, cost);
    const c = cost(spot.x, spot.y);
    if (!best || c < best.c) best = { ...spot, off, c };
  }
  pile.forEach((el, k) => placePanel(el, best.x + k * best.off, best.y + k * best.off, 1 + k, true));
}
new ResizeObserver(() => layoutPanels()).observe(holo);

// 画像はローカルサーバー経由で取得する（直リンクを断るサイトの画像も表示できるように）
function imageSrc(url) { return "/api/image?" + new URLSearchParams({ token: TOKEN, url }); }
function showPanel({ title, body = "", image_url = "" }, kind = "") {
  const el = document.createElement("section");
  el.className = "panel " + kind; el.dataset.seq = ++panelSeq;
  el.innerHTML = `<div class="scan"></div><header><h3>${escapeHtml(title)}</h3><button class="close" aria-label="閉じる">✕</button></header>`
    + (/^https?:\/\//.test(image_url) ? `<img src="${escapeHtml(imageSrc(image_url))}" alt="${escapeHtml(title)}" referrerpolicy="no-referrer">` : "")
    + (body ? `<div class="body">${renderBody(body)}</div>` : "");
  const img = el.querySelector("img");
  if (img) {
    img.onload = layoutPanels;  // 画像の大きさが分かったら並べ直す
    img.onerror = () => { img.replaceWith(Object.assign(document.createElement("div"), { className: "body notice", textContent: "画像を読み込めませんでした: " + image_url })); layoutPanels(); };
  }
  el.querySelector(".close").onclick = () => closePanel(el);
  // 重ねられたパネルはクリックで最新扱いにして手前の空き場所へ出す
  el.addEventListener("pointerdown", (e) => {
    if (el.classList.contains("stacked") && !e.target.closest(".close")) { el.dataset.seq = ++panelSeq; layoutPanels(); }
  });
  holo.appendChild(el);
  const open = [...holo.querySelectorAll(".panel:not(.closing)")];
  if (open.length > MAX_PANELS) closePanel(open.sort((a, b) => a.dataset.seq - b.dataset.seq)[0]);
  layoutPanels();
  burst();
  if (!reduceMotion) {
    // 光の点としてリアクターから飛び出し、横一線に伸びてから縦に開く
    el.animate([
      { transform: towardReactor(el, 0.02), opacity: 0, filter: "brightness(3) blur(4px)" },
      { transform: "translate(0, 0) scale(1, 0.01)", opacity: 1, filter: "brightness(2.5) blur(0)", offset: 0.45 },
      { transform: "translate(0, 0) scale(1, 1)", opacity: 1, filter: "brightness(1) blur(0)" },
    ], { duration: 700, easing: "cubic-bezier(.2, .8, .2, 1)" });
  }
  return el;
}
function closePanel(el) {
  if (!el.isConnected || el.classList.contains("closing")) return;
  el.classList.add("closing");
  layoutPanels();  // 残りのパネルは空いた場所へ寄せる
  const done = () => el.remove();
  if (reduceMotion) return done();
  el.animate([
    { transform: "translate(0, 0) scale(1, 1)", opacity: 1, filter: "brightness(1)" },
    { transform: "translate(0, 0) scale(1, 0.01)", opacity: 1, filter: "brightness(2.5)", offset: 0.4 },
    { transform: towardReactor(el, 0.02), opacity: 0, filter: "brightness(3)" },
  ], { duration: 480, easing: "ease-in", fill: "forwards" }).onfinish = done;
}
function closeAllPanels() { holo.querySelectorAll(".panel").forEach(closePanel); }

// ---------- 送信 ----------
let busy = false;
function setBusy(b) { busy = b; sendBtn.disabled = b; inputEl.disabled = b; }

async function send(text) {
  text = (text ?? inputEl.value).trim();
  if (!text || busy) return;
  stopSpeaking();
  inputEl.value = ""; fitInput();
  addBubble("user", escapeHtml(text));
  const bubble = addBubble("jarvis", "");
  let raw = "", extras = "";
  const paint = () => { bubble.innerHTML = extras + renderText(raw); scrollDown(); };
  setBusy(true); setState("thinking"); speechBuffer = "";

  try {
    const res = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json", "X-Jarvis-Token": TOKEN },
      body: JSON.stringify({ message: text, record: recordEnabled }),
    });
    if (res.status === 409) throw new Error("前の返答を処理中です。少し待ってからお試しください。");
    if (!res.ok || !res.body) throw new Error("サーバーに接続できません（" + res.status + "）");

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buf = "";
    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });
      let idx;
      while ((idx = buf.indexOf("\n\n")) >= 0) {
        const line = buf.slice(0, idx); buf = buf.slice(idx + 2);
        if (!line.startsWith("data: ")) continue;
        const ev = JSON.parse(line.slice(6));
        if (ev.type === "text") {
          if (state === "thinking" && !pendingUtterances) setState("thinking", "応答中…");
          raw += ev.text; feedSpeech(ev.text); paint();
        } else if (ev.type === "tool") {
          const label = TOOL_LABEL[ev.name] || "⚙ " + ev.name;
          extras += `<span class="chip">${escapeHtml(label)}</span><br>`;
          if (raw) { raw += "\n"; }
          if (!pendingUtterances) setState("thinking", label + "…");
          paint();
        } else if (ev.type === "display") {
          showPanel(ev);
          extras += `<span class="chip">🖼 ${escapeHtml(ev.title)}</span><br>`;
          paint();
        } else if (ev.type === "notice") {
          raw +=(raw ? "\n" : "") + "［" + ev.text + "］"; paint();
        } else if (ev.type === "error") {
          throw new Error(ev.text);
        }
      }
    }
    feedSpeech("", true);
    if (!raw && !extras) bubble.remove();
  } catch (err) {
    if (!raw) bubble.remove();
    addError(err.message || String(err));
    speechBuffer = "";
  } finally {
    setBusy(false);
    if (!pendingUtterances) { setState("idle"); afterSpeech(); }
    if (!listening) inputEl.focus();
  }
}
sendBtn.onclick = () => send();

function chime() {
  try {
    audioCtx = audioCtx || new AudioContext();
    audioCtx.resume();
    const now = audioCtx.currentTime;
    [880, 1320].forEach((f, i) => {
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = "sine"; o.frequency.value = f;
      g.gain.setValueAtTime(0, now + i * 0.09);
      g.gain.linearRampToValueAtTime(0.18 * volume + 0.0011, now + i * 0.09 + 0.02);  // 指数カーブ用に 0.001 より大きく保つ
      g.gain.exponentialRampToValueAtTime(0.001, now + i * 0.09 + 0.25);
      o.connect(g).connect(audioCtx.destination);
      o.start(now + i * 0.09); o.stop(now + i * 0.09 + 0.3);
    });
  } catch {}
}

// 回転させて使う目盛りは一度だけ作る
function radialTicks(count, r0, r1, pick = () => true) {
  const p = new Path2D();
  for (let i = 0; i < count; i++) {
    if (!pick(i)) continue;
    const a = i / count * TAU, c = Math.cos(a), s = Math.sin(a);
    const from = typeof r0 === "function" ? r0(i) : r0;
    p.moveTo(c * from, s * from); p.lineTo(c * r1, s * r1);
  }
  return p;
}
const OUTER_MINOR = radialTicks(180, 240, 245, i => i % 5 !== 0);
const OUTER_MAJOR = radialTicks(180, i => i % 15 === 0 ? 233 : 237, 245, i => i % 5 === 0);
const INNER_TICKS = radialTicks(72, i => i % 6 === 0 ? 132 : 135, 140);

// パネルを出すときの演出：リアクターが光り、衝撃波と火花が広がる
function burst() {
  flash = 1;
  if (reduceMotion) return;
  waves.push(0);
  for (let i = 0; i < 28; i++) addSpark(2 + Math.random() * 4);
}
function addSpark(v) { sparks.push({ a: Math.random() * TAU, r: 126, v, life: 1 }); }
function fitCanvas() {
  const px = Math.round(canvas.clientWidth * (window.devicePixelRatio || 1));
  if (px && canvas.width !== px) canvas.width = canvas.height = px;
}
new ResizeObserver(fitCanvas).observe(canvas);
function circle(r) { ctx.beginPath(); ctx.arc(0, 0, r, 0, TAU); }
function polar(a, r) { return [Math.cos(a) * r, Math.sin(a) * r]; }

// スペクトルの値：聞いている間はマイクの周波数、話している間は声に合わせた揺れ、考え中は巡回する光
function updateBands() {
  const mic = state === "listening" && analyser;
  if (mic) analyser.getByteFrequencyData(freqData);
  for (let i = 0; i < BANDS; i++) {
    const x = i / BANDS;
    let v;
    if (mic) v = Math.min(1, freqData[Math.floor(2 + x ** 1.4 * 70)] / 255 * 1.3);
    else if (state === "speaking") v = energy * (0.3 + 0.7 * Math.abs(Math.sin(i * 0.7 + t * 11) * Math.sin(i * 0.23 - t * 7.3))) * (1 - x * 0.5);
    else if (state === "thinking") v = 0.06 + 0.45 * Math.max(0, Math.cos(x * TAU * 2 - t * 8)) ** 6;
    else v = 0.04 + 0.05 * Math.sin(i * 0.5 + t * 2) ** 2;
    bands[i] += (v - bands[i]) * (v > bands[i] ? 0.45 : 0.12);
  }
}

function drawBackdrop(e) {
  const g = ctx.createRadialGradient(0, 0, 0, 0, 0, 255);
  g.addColorStop(0, HI(0.5 + e * 0.5));
  g.addColorStop(0.07, C(0.32 + e * 0.3));
  g.addColorStop(0.2, DEEP(0.12 + e * 0.12));
  g.addColorStop(0.55, DEEP(0.035 + e * 0.04));
  g.addColorStop(1, DEEP(0));
  ctx.fillStyle = g; circle(255); ctx.fill();
}

// レーダーのように回る走査光（考え中は強く光る）
function drawSweep(e) {
  if (!ctx.createConicGradient) return;
  const a = spin * 0.9, peak = (state === "thinking" ? 0.2 : 0.055) + e * 0.08;
  const g = ctx.createConicGradient(a, 0, 0);
  g.addColorStop(0, C(0)); g.addColorStop(0.78, C(0)); g.addColorStop(1, C(peak));
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(0, 0, 230, 0, TAU); ctx.arc(0, 0, 62, 0, TAU, true); ctx.fill();
  ctx.lineWidth = 1; ctx.strokeStyle = HI(peak * 2.2);
  ctx.beginPath(); ctx.moveTo(...polar(a, 62)); ctx.lineTo(...polar(a, 230)); ctx.stroke();
}

function drawOuterScale(e, pace) {
  ctx.lineWidth = 1; ctx.strokeStyle = C(0.2 + e * 0.15); circle(250); ctx.stroke();
  // ゆっくり回る目盛りと角度の数字
  ctx.save(); ctx.rotate(spin * 0.04);
  ctx.lineWidth = 1; ctx.strokeStyle = C(0.22 + e * 0.2); ctx.stroke(OUTER_MINOR);
  ctx.lineWidth = 1.3; ctx.strokeStyle = C(0.5 + e * 0.35); ctx.stroke(OUTER_MAJOR);
  ctx.fillStyle = C(0.45 + e * 0.3); ctx.font = "7px Consolas, monospace";
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  for (let i = 0; i < 12; i++) {
    ctx.save(); ctx.rotate(i / 12 * TAU); ctx.translate(225, 0); ctx.rotate(Math.PI / 2);
    ctx.fillText(String(i * 30).padStart(3, "0"), 0, 0); ctx.restore();
  }
  ctx.restore();
  // 四方の留め具
  ctx.save(); ctx.rotate(-spin * 0.08);
  for (let k = 0; k < 4; k++) {
    const a = k * TAU / 4 + Math.PI / 4;
    ctx.lineWidth = 2.5; ctx.strokeStyle = C(0.6 + e * 0.3);
    ctx.beginPath(); ctx.arc(0, 0, 254, a - 0.28, a + 0.28); ctx.stroke();
    ctx.lineWidth = 1; ctx.beginPath();
    for (const b of [a - 0.28, a + 0.28]) { ctx.moveTo(...polar(b, 247)); ctx.lineTo(...polar(b, 257)); }
    ctx.stroke();
  }
  ctx.restore();
  // 漂う光の粒
  for (const d of dust) {
    d.a += d.v * pace * speedNow;
    const [x, y] = polar(d.a, d.r);
    ctx.fillStyle = HI(0.08 + 0.35 * (0.5 + 0.5 * Math.sin(t * 3 + d.p)));
    ctx.fillRect(x - 0.7, y - 0.7, 1.4, 1.4);
  }
}

function drawSpectrum(e) {
  ctx.lineWidth = 1; ctx.strokeStyle = C(0.18 + e * 0.1); circle(194); ctx.stroke();
  const bars = new Path2D(), n = BANDS * 2;
  for (let i = 0; i < n; i++) {
    const v = bands[i < BANDS ? i : n - 1 - i];
    const a = (i + 0.5) / n * TAU - Math.PI / 2;  // 低い音が上、高い音が下に来る左右対称の並び
    bars.moveTo(...polar(a, 197)); bars.lineTo(...polar(a, 199 + v * 20));
  }
  ctx.lineWidth = 3; ctx.strokeStyle = C(0.3 + e * 0.45); ctx.stroke(bars);
}

// 太い機械的な弧（縞模様と端の切り欠き付き）
function drawHeavyArcs(e) {
  ctx.save(); ctx.rotate(spin * 0.35);
  for (let k = 0; k < 3; k++) {
    const a0 = k * TAU / 3, a1 = a0 + TAU / 3 - 0.5;
    ctx.lineWidth = 1.2; ctx.strokeStyle = C(0.55 + e * 0.35);
    ctx.beginPath(); ctx.arc(0, 0, 183, a0, a1); ctx.stroke();
    ctx.beginPath(); ctx.arc(0, 0, 173, a0, a1); ctx.stroke();
    ctx.setLineDash([1.6, 2.4]); ctx.lineWidth = 7; ctx.strokeStyle = C(0.22 + e * 0.35);
    ctx.beginPath(); ctx.arc(0, 0, 178, a0, a1); ctx.stroke(); ctx.setLineDash([]);
    ctx.lineWidth = 1.5; ctx.strokeStyle = HI(0.6 + e * 0.3); ctx.beginPath();
    for (const a of [a0, a1]) { ctx.moveTo(...polar(a, 167)); ctx.lineTo(...polar(a, 189)); }
    ctx.stroke();
  }
  ctx.restore();
  ctx.save(); ctx.rotate(-spin * 0.6);
  ctx.lineWidth = 2; ctx.strokeStyle = C(0.38 + e * 0.4);
  for (let k = 0; k < 6; k++) { const a = k * TAU / 6; ctx.beginPath(); ctx.arc(0, 0, 163, a, a + TAU / 6 - 0.35); ctx.stroke(); }
  ctx.restore();
}

// 点線の軌道と、尾を引いて周回する3つの光
function drawOrbiters(e) {
  ctx.save(); ctx.rotate(spin * 0.5);
  ctx.setLineDash([2, 5]); ctx.lineWidth = 1; ctx.strokeStyle = C(0.3 + e * 0.3); circle(152); ctx.stroke(); ctx.setLineDash([]);
  ctx.restore();
  for (let k = 0; k < 3; k++) {
    const a = -spin * 1.1 + k * TAU / 3;
    ctx.lineWidth = 2;
    for (let j = 0; j < 10; j++) {
      ctx.strokeStyle = HI((1 - j / 10) * (0.5 + e * 0.3));
      ctx.beginPath(); ctx.arc(0, 0, 152, a + j * 0.035, a + (j + 1) * 0.035); ctx.stroke();
    }
    const [x, y] = polar(a, 152);
    const g = ctx.createRadialGradient(x, y, 0, x, y, 10);
    g.addColorStop(0, HI(1)); g.addColorStop(0.25, C(0.7)); g.addColorStop(1, C(0));
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, 10, 0, TAU); ctx.fill();
  }
}

// 中心部の境界（目盛りの輪）
function drawInnerScale(e) {
  ctx.lineWidth = 0.8; ctx.strokeStyle = C(0.15 + e * 0.1); circle(146); ctx.stroke();
  ctx.save(); ctx.rotate(-spin * 0.1);
  ctx.lineWidth = 1; ctx.strokeStyle = C(0.35 + e * 0.3); ctx.stroke(INNER_TICKS);
  ctx.restore();
  ctx.lineWidth = 1.5; ctx.strokeStyle = C(0.5 + e * 0.3); circle(128); ctx.stroke();
}

// 巻き線のあるコイル。考え中は光が順に巡る
function drawCoils(e) {
  ctx.save(); ctx.rotate(spin * 0.15);
  const n = 10, w = 0.44;
  for (let k = 0; k < n; k++) {
    const a0 = k * TAU / n, a1 = a0 + w;
    const chase = Math.max(0, Math.cos(a0 - spin * 2.5)) ** 8;
    const lit = (state === "thinking" ? chase : chase * 0.25) + e * 0.5 + flash * 0.5;
    ctx.beginPath(); ctx.arc(0, 0, 122, a0, a1); ctx.arc(0, 0, 100, a1, a0, true); ctx.closePath();
    ctx.fillStyle = C(0.07 + lit * 0.35); ctx.fill();
    ctx.lineWidth = 1; ctx.strokeStyle = C(0.35 + lit * 0.5); ctx.stroke();
    ctx.beginPath();
    for (let j = 1; j < 9; j++) { const a = a0 + w * j / 9; ctx.moveTo(...polar(a, 103)); ctx.lineTo(...polar(a, 119)); }
    ctx.lineWidth = 0.8; ctx.strokeStyle = HI(0.16 + lit * 0.5); ctx.stroke();
  }
  ctx.restore();
}

// 声に合わせて揺れる波形の輪
function drawWaveform(e) {
  for (const [r, amp, ph, alpha] of [[91, 18, 0, 0.6], [86, 10, 1.7, 0.3]]) {
    ctx.beginPath();
    for (let a = 0; a <= TAU + 0.01; a += 0.04) {
      const rr = r + Math.sin(a * 6 + t * 6 + ph) * Math.sin(a * 3 - t * 4) * e * amp;
      a === 0 ? ctx.moveTo(...polar(a, rr)) : ctx.lineTo(...polar(a, rr));
    }
    ctx.closePath(); ctx.lineWidth = 1.5; ctx.strokeStyle = HI(alpha * (0.4 + e)); ctx.stroke();
  }
}

// 中心のハブと光の核
function drawHub(e) {
  ctx.save(); ctx.rotate(-spin * 0.25);
  ctx.lineWidth = 1; ctx.strokeStyle = C(0.4 + e * 0.3); ctx.beginPath();
  for (let k = 0; k < 3; k++) {
    const a = k * TAU / 3, c = Math.cos(a), s = Math.sin(a);
    for (const o of [-4, 4]) { ctx.moveTo(c * 60 - s * o, s * 60 + c * o); ctx.lineTo(c * 80 - s * o, s * 80 + c * o); }
  }
  ctx.stroke();
  ctx.setLineDash([3, 3]); ctx.strokeStyle = C(0.35 + e * 0.3); circle(52); ctx.stroke(); ctx.setLineDash([]);
  ctx.restore();
  ctx.lineWidth = 2; ctx.strokeStyle = C(0.55 + e * 0.35); circle(60); ctx.stroke();
  ctx.lineWidth = 1; ctx.strokeStyle = HI(0.3 + e * 0.4); circle(44); ctx.stroke();
  const r = 34 + e * 14 + Math.sin(t * 3) * 2;
  const g = ctx.createRadialGradient(0, 0, 0, 0, 0, r);
  g.addColorStop(0, HI(1)); g.addColorStop(0.35, HI(0.75 + e * 0.25)); g.addColorStop(0.65, C(0.45 + e * 0.3)); g.addColorStop(1, C(0));
  ctx.fillStyle = g; circle(r); ctx.fill();
}

// コイルから外へ飛び出す火花（勢いがあるほど多い）
function drawSparks(dt) {
  if (!reduceMotion && Math.random() < (0.04 + energy * 0.6) * dt) addSpark(1 + Math.random() * 2 + energy * 3);
  sparks = sparks.filter(p => (p.r += p.v * dt, p.life -= 0.015 * dt, p.life > 0 && p.r < 252));
  ctx.lineWidth = 1.2;
  for (const p of sparks) {
    const len = 4 + p.v * 3;
    ctx.strokeStyle = HI(p.life * 0.8);
    ctx.beginPath(); ctx.moveTo(...polar(p.a, p.r - len)); ctx.lineTo(...polar(p.a, p.r)); ctx.stroke();
  }
}

function drawShockwaves(dt) {
  waves = waves.map(w => w + 0.022 * dt).filter(w => w < 1);
  for (const w of waves) {
    const r = 90 + (1 - (1 - w) ** 2) * 165;
    ctx.lineWidth = 3 * (1 - w) + 0.5; ctx.strokeStyle = HI((1 - w) * 0.8); circle(r); ctx.stroke();
    ctx.lineWidth = 1; ctx.strokeStyle = C((1 - w) * 0.4); circle(r * 0.93); ctx.stroke();
  }
}

// 横に伸びる光の筋
function drawFlare(e) {
  const a = flash * 0.7 + e * 0.12;
  if (a < 0.01) return;
  ctx.save(); ctx.scale(1, 0.018);
  const g = ctx.createRadialGradient(0, 0, 0, 0, 0, 250);
  g.addColorStop(0, HI(a)); g.addColorStop(0.3, C(a * 0.4)); g.addColorStop(1, C(0));
  ctx.fillStyle = g; circle(250); ctx.fill();
  ctx.restore();
}

// 描いた絵を縮小して拡大し直し、加算で重ねて全体をにじませる
function drawBloom(e) {
  const W = canvas.width;
  let src = canvas;
  for (const [i, b] of bloom.entries()) {
    const size = Math.max(4, Math.round(W / (i ? 16 : 5)));
    if (b.width !== size) b.width = b.height = size;
    const bc = b.getContext("2d");
    bc.clearRect(0, 0, size, size); bc.imageSmoothingQuality = "high";
    bc.drawImage(src, 0, 0, size, size);
    src = b;
  }
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.imageSmoothingQuality = "high";
  ctx.globalAlpha = 0.4 + e * 0.3; ctx.drawImage(bloom[0], 0, 0, W, W);
  ctx.globalAlpha = 0.6 + e * 0.4; ctx.drawImage(bloom[1], 0, 0, W, W);
  ctx.globalAlpha = 1;
}

function drawOrb(now) {
  requestAnimationFrame(drawOrb);
  const dt = lastFrame ? Math.min(3, (now - lastFrame) / 16.67) : 1;  // 60fps を 1 とした経過時間
  lastFrame = now;
  const pace = (reduceMotion ? 0.25 : 1) * dt;
  t += 0.012 * pace;
  speedNow += (STATE_SPEED[state] - speedNow) * Math.min(1, 0.04 * dt);  // 状態が変わっても回転が飛ばないよう徐々に変える
  spin += 0.012 * pace * speedNow;
  let target = 0.1;
  if (state === "listening") target = 0.25 + micLevel() * 0.9;
  else if (state === "speaking") target = 0.35 + 0.3 * Math.abs(Math.sin(t * 9) * Math.sin(t * 3.7 + 1));
  else if (state === "thinking") target = 0.3;
  energy += (target + flash * 0.6 - energy) * Math.min(1, 0.15 * dt);
  flash *= 0.94 ** dt;
  updateBands();

  const W = canvas.width;
  if (!W) return;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalCompositeOperation = "source-over";
  ctx.clearRect(0, 0, W, W);
  ctx.setTransform(W / ORB_SIZE, 0, 0, W / ORB_SIZE, W / 2, W / 2);
  ctx.globalCompositeOperation = "lighter";  // 光が重なるほど明るくなる
  const e = energy;
  drawBackdrop(e);
  drawSweep(e);
  drawOuterScale(e, pace);
  drawSpectrum(e);
  drawHeavyArcs(e);
  drawOrbiters(e);
  drawInnerScale(e);
  drawCoils(e);
  drawWaveform(e);
  drawHub(e);
  drawSparks(dt);
  drawShockwaves(dt);
  drawFlare(e);
  drawBloom(e);
}
requestAnimationFrame(drawOrb);
inputEl.focus();
</script>
</body>
</html>
